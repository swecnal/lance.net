<script>
(function(){
  var THEMES = [{"id":"2889e11e-5e3e-472d-b88f-b1ff909dfcbd","name":"matrix","bgColor":"#000000","navFont":null,"navFontWeight":"600","navColor":"#00ff41","contentFont":null,"contentFontWeight":"600","contentColor":"#00ff41","counterBgColor":"#000000","counterTextColor":"#00ff41","linkColor":"#00ff41","vlinkColor":"#00b100","alinkColor":"#00ff41","switcherChar":null,"switcherSize":null,"switcherColor":"#8a8a8a","switcherLinkColor":"#8a8a8a","switcherVlinkColor":"#8a8a8a","switcherAlinkColor":"#8a8a8a"},{"id":"cb38d8eb-ab94-4965-af40-4189f9eb9ffe","name":"console","bgColor":"#121212","navFont":"Courier, \"Courier New\", monospace","navFontWeight":"600","navColor":"#e95420","contentFont":"Courier, \"Courier New\", monospace","contentFontWeight":"600","contentColor":"#e95420","counterBgColor":"#121212","counterTextColor":"#e95420","linkColor":"#e95420","vlinkColor":"#b70116","alinkColor":"#e95420","switcherChar":null,"switcherSize":null,"switcherColor":"#8a8a8a","switcherLinkColor":"#8a8a8a","switcherVlinkColor":"#8a8a8a","switcherAlinkColor":"#8a8a8a"}];
  var MENU_TITLE = "";
  var KEY = "lance.net-theme";
  function applyTheme(t){
    var css = [];
    if (t.bgColor) {
      css.push("body{background-color:"+t.bgColor+";}");
      // Counter bleeds the body bg by default so it doesn't punch a hole.
      css.push(".counter{background-color:"+t.bgColor+";}");
    }
    // Explicit counter overrides win over the bleed-through above.
    if (t.counterBgColor)   css.push(".counter{background-color:"+t.counterBgColor+";}");
    if (t.counterTextColor) css.push(".counter,.counter .counter-label,.counter .counter-number{color:"+t.counterTextColor+";}");
    var nav = [];
    if (t.navFont) nav.push("font-family:"+t.navFont);
    if (t.navFontWeight) nav.push("font-weight:"+t.navFontWeight);
    if (t.navColor) nav.push("color:"+t.navColor);
    if (nav.length) css.push("nav,nav a{"+nav.join(";")+";}");
    var main = [];
    if (t.contentFont) main.push("font-family:"+t.contentFont);
    if (t.contentFontWeight) main.push("font-weight:"+t.contentFontWeight);
    if (t.contentColor) main.push("color:"+t.contentColor);
    if (main.length) css.push("main,main a{"+main.join(";")+";}");
    // Site-wide link state colors (excluding the # switcher, which has its own).
    if (t.linkColor)  css.push("a:link:not(.theme-switcher){color:"+t.linkColor+";}");
    if (t.vlinkColor) css.push("a:visited:not(.theme-switcher){color:"+t.vlinkColor+";}");
    if (t.alinkColor) css.push("a:active:not(.theme-switcher){color:"+t.alinkColor+";}");
    // The "#" switcher gets its own colors so it stays visible against any theme.
    if (typeof t.switcherSize === "number" && t.switcherSize > 0) css.push(".theme-switcher{font-size:"+t.switcherSize+"px;}");
    if (t.switcherColor)      css.push(".theme-switcher{color:"+t.switcherColor+";opacity:1;}");
    if (t.switcherLinkColor)  css.push(".theme-switcher:link{color:"+t.switcherLinkColor+";}");
    if (t.switcherVlinkColor) css.push(".theme-switcher:visited{color:"+t.switcherVlinkColor+";}");
    if (t.switcherAlinkColor) css.push(".theme-switcher:active{color:"+t.switcherAlinkColor+";}");
    var el = document.getElementById("lance-theme-override");
    if (!el) { el = document.createElement("style"); el.id = "lance-theme-override"; document.head.appendChild(el); }
    el.textContent = css.join("\n");
    // Swap the switcher character to whatever this theme says.
    var btn = document.querySelector(".theme-switcher");
    if (btn) btn.textContent = (typeof t.switcherChar === "string" && t.switcherChar.length > 0) ? t.switcherChar : "#";
  }
  function clearTheme(){
    var el = document.getElementById("lance-theme-override");
    if (el) el.textContent = "";
    var btn = document.querySelector(".theme-switcher");
    if (btn) btn.textContent = "#";
  }
  try {
    var savedId = sessionStorage.getItem(KEY);
    if (savedId) {
      var found = THEMES.filter(function(x){ return x.id === savedId; })[0];
      if (found) applyTheme(found);
    }
  } catch(e) {}
  document.addEventListener("DOMContentLoaded", function(){
    var btn = document.querySelector(".theme-switcher");
    if (!btn) return;
    btn.addEventListener("click", function(e){
      e.preventDefault();
      var existing = document.getElementById("lance-theme-menu");
      if (existing) { existing.remove(); return; }
      var isMobile = window.matchMedia("(max-width: 600px)").matches;
      var itemPad = isMobile ? "12px 18px" : "5px 12px";
      var itemFont = isMobile ? "16px" : "13px";
      var menu = document.createElement("div");
      menu.id = "lance-theme-menu";
      menu.setAttribute("style",
        "position:fixed;background:#fff;border:1px solid #888;padding:4px 0;" +
        "z-index:99999;font-family:sans-serif;color:#000;min-width:" + (isMobile ? "180px" : "140px") +
        ";max-width:80vw;max-height:70vh;overflow-y:auto;box-shadow:0 2px 12px rgba(0,0,0,0.18);" +
        "border-radius:4px;font-size:" + itemFont + ";"
      );
      function row(label, onclick){
        var d = document.createElement("div");
        d.textContent = label;
        d.setAttribute("style", "cursor:pointer;padding:" + itemPad + ";");
        d.onmouseover = function(){ d.style.background = "#eef"; };
        d.onmouseout = function(){ d.style.background = ""; };
        d.onclick = onclick;
        menu.appendChild(d);
      }
      // Optional non-clickable title at the top of the menu.
      if (MENU_TITLE) {
        var titleEl = document.createElement("div");
        titleEl.textContent = MENU_TITLE;
        titleEl.setAttribute("style",
          "padding:" + itemPad + ";font-weight:600;border-bottom:1px solid #ddd;" +
          "color:#444;cursor:default;letter-spacing:0.02em;");
        menu.appendChild(titleEl);
      }
      row("default", function(){ try { sessionStorage.removeItem(KEY); } catch(e){} clearTheme(); menu.remove(); });
      THEMES.forEach(function(t){
        row(t.name, function(){ try { sessionStorage.setItem(KEY, t.id); } catch(e){} applyTheme(t); menu.remove(); });
      });
      document.body.appendChild(menu);
      // Position the menu relative to the button instead of hardcoding a
      // corner. Anchors near the button regardless of where it actually sits.
      var r = btn.getBoundingClientRect();
      var mw = menu.offsetWidth;
      var mh = menu.offsetHeight;
      var margin = 8;
      // Prefer above the button; flip below if there's not enough room.
      var spaceAbove = r.top;
      if (spaceAbove >= mh + margin) {
        menu.style.top = (r.top - mh - margin) + "px";
      } else {
        menu.style.top = (r.bottom + margin) + "px";
      }
      // Anchor left or right edge of the menu to the button, whichever keeps it on-screen.
      var anchorLeft = r.left;
      if (anchorLeft + mw > window.innerWidth - margin) {
        anchorLeft = window.innerWidth - mw - margin;
      }
      if (anchorLeft < margin) anchorLeft = margin;
      menu.style.left = anchorLeft + "px";
      setTimeout(function(){
        function dismiss(ev){
          if (!menu.contains(ev.target) && ev.target !== btn) {
            menu.remove();
            document.removeEventListener("click", dismiss);
            document.removeEventListener("touchstart", dismiss);
          }
        }
        document.addEventListener("click", dismiss);
        document.addEventListener("touchstart", dismiss);
      }, 0);
    });
  });
})();
</script>
<script>
(function(){
  var CLASS="gallery";
  if(!CLASS)return;
  var IMG=/\.(jpe?g|png|webp|gif|avif|bmp|svg)(\?|#|$)/i;
  var overlay,imgEl,counterEl,srcs=[],cur=0;
  function build(){
    overlay=document.createElement('div');
    overlay.id='lance-lb';
    overlay.innerHTML='<button class="lance-lb-close" aria-label="Close">\u00d7</button>'+
      '<button class="lance-lb-prev" aria-label="Previous">\u2039</button>'+
      '<button class="lance-lb-next" aria-label="Next">\u203a</button>'+
      '<img class="lance-lb-img" alt="">'+
      '<div class="lance-lb-counter"></div>';
    document.body.appendChild(overlay);
    imgEl=overlay.querySelector('.lance-lb-img');
    counterEl=overlay.querySelector('.lance-lb-counter');
    overlay.querySelector('.lance-lb-close').addEventListener('click',function(e){e.stopPropagation();closeLb();});
    overlay.querySelector('.lance-lb-prev').addEventListener('click',function(e){e.stopPropagation();prev();});
    overlay.querySelector('.lance-lb-next').addEventListener('click',function(e){e.stopPropagation();next();});
    imgEl.addEventListener('click',function(e){e.stopPropagation();});
    overlay.addEventListener('click',function(e){if(e.target===overlay)closeLb();});
  }
  function openLb(images,startIdx){
    if(!overlay)build();
    srcs=images;cur=startIdx;
    update();
    overlay.classList.add('open');
    document.body.style.overflow='hidden';
    document.addEventListener('keydown',onKey);
  }
  function closeLb(){
    if(!overlay)return;
    overlay.classList.remove('open');
    document.body.style.overflow='';
    document.removeEventListener('keydown',onKey);
  }
  function update(){
    imgEl.src=srcs[cur];
    counterEl.textContent=(cur+1)+' / '+srcs.length;
  }
  function prev(){cur=(cur-1+srcs.length)%srcs.length;update();}
  function next(){cur=(cur+1)%srcs.length;update();}
  function onKey(e){
    if(e.key==='Escape')closeLb();
    else if(e.key==='ArrowLeft')prev();
    else if(e.key==='ArrowRight')next();
  }
  function init(){
    var galleries=document.getElementsByClassName(CLASS);
    for(var g=0;g<galleries.length;g++){
      var links=galleries[g].querySelectorAll('a');
      var imgs=[];
      for(var i=0;i<links.length;i++){if(IMG.test(links[i].href))imgs.push(links[i]);}
      if(!imgs.length)continue;
      var hrefs=imgs.map(function(a){return a.href;});
      imgs.forEach(function(a,idx){
        a.addEventListener('click',function(e){
          if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1)return; // let middle/cmd-click open in tab
          e.preventDefault();
          openLb(hrefs,idx);
        });
      });
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
